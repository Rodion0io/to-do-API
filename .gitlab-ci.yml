stages:
  - build
  - test
  - deploy

build-job:
  stage: build
  script:
    - docker build -t app:latest .

test-job:
  stage: test
  script: 
#    - -s -v вроде бы для логов
    - docker run -d --rm app:latest dotnet test -s -v
  artifacts: 
    paths:
      - ./Dockerfile
    when: on_success
    expire_in: 30 days

deploy-job:
  stage: deploy
  script:
    - docker-compose up -d
    - echo "Deploy to staging server"
  dependencies:
    - test-job
  environment:
      name: staging
      url: https://staging.example.com

